<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Vampire Roguelike Survival 2D</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0b0c10;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #fff;
    }
    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    /* HUD Overlays */
    #hud {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      pointer-events: none;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 10;
    }
    .hud-top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
      font-weight: bold;
    }
    .timer-badge {
      font-size: 22px;
      background: rgba(0, 0, 0, 0.6);
      padding: 4px 14px;
      border-radius: 20px;
      border: 1px solid #45f3ff44;
      color: #66fcf1;
      letter-spacing: 1px;
    }
    .stats-badge {
      font-size: 16px;
      background: rgba(0, 0, 0, 0.6);
      padding: 4px 12px;
      border-radius: 12px;
      color: #ffd700;
      border: 1px solid #ffd70044;
    }
    .exp-bar-container {
      width: 100%;
      height: 14px;
      background: rgba(20, 20, 25, 0.8);
      border-radius: 7px;
      border: 1px solid #2b3952;
      overflow: hidden;
      position: relative;
    }
    .exp-bar-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #3a7bd5, #00d2ff);
      box-shadow: 0 0 10px #00d2ff88;
      transition: width 0.15s ease-out;
    }
    .level-label {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      font-size: 10px;
      font-weight: bold;
      color: #ffffff;
      text-shadow: 0 1px 2px #000;
    }
    /* Virtual Joystick */
    #joystick-zone {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      z-index: 5;
    }
    .joystick-base {
      position: absolute;
      width: 120px;
      height: 120px;
      background: radial-gradient(circle, rgba(100, 150, 255, 0.15) 0%, rgba(20, 30, 60, 0.4) 70%);
      border: 2px solid rgba(100, 200, 255, 0.4);
      border-radius: 50%;
      pointer-events: none;
      transform: translate(-50%, -50%);
      display: none;
    }
    .joystick-thumb {
      position: absolute;
      width: 50px;
      height: 50px;
      background: radial-gradient(circle, #66fcf1 0%, #1f2833 100%);
      border: 2px solid #fff;
      border-radius: 50%;
      pointer-events: none;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 15px rgba(102, 252, 241, 0.6);
      display: none;
    }
    /* Level Up Modal */
    #level-up-modal {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(5, 8, 15, 0.88);
      backdrop-filter: blur(8px);
      z-index: 100;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    #level-up-modal.active {
      display: flex;
    }
    .modal-title {
      font-size: 28px;
      font-weight: 800;
      color: #ffd700;
      text-shadow: 0 0 15px rgba(255, 215, 0, 0.7);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    .modal-subtitle {
      font-size: 14px;
      color: #a0aec0;
      margin-bottom: 24px;
    }
    .card-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 100%;
      max-width: 420px;
    }
    .upgrade-card {
      background: linear-gradient(135deg, #1f2833 0%, #12161f 100%);
      border: 2px solid #45f3ff44;
      border-radius: 12px;
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 16px;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 0 6px 16px rgba(0,0,0,0.4);
    }
    .upgrade-card:hover, .upgrade-card:active {
      transform: scale(1.03);
      border-color: #66fcf1;
      box-shadow: 0 0 20px rgba(102, 252, 241, 0.5);
      background: linear-gradient(135deg, #2b394d 0%, #1b2230 100%);
    }
    .card-icon {
      font-size: 34px;
      width: 54px;
      height: 54px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.4);
      border-radius: 10px;
      border: 1px solid #45f3ff33;
    }
    .card-info {
      flex: 1;
    }
    .card-name {
      font-size: 17px;
      font-weight: bold;
      color: #66fcf1;
      margin-bottom: 4px;
    }
    .card-desc {
      font-size: 13px;
      color: #c5c6c7;
      line-height: 1.3;
    }
    .card-level {
      font-size: 11px;
      color: #ffd700;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    /* Game Over Modal */
    #game-over-modal {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(10, 0, 5, 0.92);
      backdrop-filter: blur(8px);
      z-index: 150;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    #game-over-modal.active {
      display: flex;
    }
    .game-over-title {
      font-size: 38px;
      font-weight: 900;
      color: #e63946;
      text-shadow: 0 0 20px rgba(230, 57, 70, 0.8);
      margin-bottom: 12px;
      letter-spacing: 2px;
    }
    .game-over-score {
      font-size: 18px;
      color: #f1faee;
      margin-bottom: 24px;
      line-height: 1.6;
    }
    .btn-restart {
      padding: 14px 36px;
      background: linear-gradient(135deg, #e63946, #b01b27);
      border: none;
      border-radius: 30px;
      color: #fff;
      font-size: 18px;
      font-weight: bold;
      letter-spacing: 1px;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(230, 57, 70, 0.6);
      transition: transform 0.2s;
    }
    .btn-restart:active {
      transform: scale(0.95);
    }
    /* Instructions banner */
    .instruction-hint {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.6);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 12px;
      color: #a0aec0;
      pointer-events: none;
      z-index: 10;
      animation: fadeHint 4s forwards 6s;
    }
    @keyframes fadeHint {
      to { opacity: 0; visibility: hidden; }
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <!-- HUD -->
    <div id="hud">
      <div class="hud-top-row">
        <div class="stats-badge" id="killCount">⚔️ 0</div>
        <div class="timer-badge" id="survivalTime">00:00</div>
        <div class="stats-badge" id="playerHP">❤️ 100/100</div>
      </div>
      <div class="exp-bar-container">
        <div class="exp-bar-fill" id="expFill"></div>
        <div class="level-label" id="levelText">CẤP 1</div>
      </div>
    </div>

    <!-- Joystick Element -->
    <div id="joystick-zone">
      <div class="joystick-base" id="joyBase"></div>
      <div class="joystick-thumb" id="joyThumb"></div>
    </div>

    <div class="instruction-hint">🎮 Dùng phím W/A/S/D hoặc Chạm & Kéo màn hình để di chuyển</div>

    <!-- Level Up Dialog -->
    <div id="level-up-modal">
      <div class="modal-title">LÊN CẤP!</div>
      <div class="modal-subtitle">Chọn 1 sức mạnh / vũ khí mới</div>
      <div class="card-list" id="upgradeCards"></div>
    </div>

    <!-- Game Over Dialog -->
    <div id="game-over-modal">
      <div class="game-over-title">BẠN ĐÃ TỬ TRẬN</div>
      <div class="game-over-score" id="gameOverStats">
        Thời gian sinh tồn: 00:00<br>
        Số quái tiêu diệt: 0<br>
        Cấp độ đạt được: 1
      </div>
      <button class="btn-restart" id="btnRestart">CHƠI LẠI</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
